openapi: 3.0.3
info:
  title: InternFlare Job API
  version: 1.0.0
  description: API documentation for job-related endpoints protected with JWT authentication.

servers:
  - url: http://localhost:8000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Job:
      type: object
      required:
        - jobTitle
        - description
        - jobType
      properties:
        jobTitle:
          type: string
          example: "Frontend Developer"
          description: "Title of the job"
        description:
          type: string
          example: "Develop and maintain web applications"
          description: "Detailed description of the job"
        jobType:
          type: string
          example: "Full-time"
          description: "Type of job (e.g., Full-time, Part-time, Contract)"

  responses:
    UnauthorizedError:
      description: "Authentication information is missing or invalid"
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "fail"
              message:
                type: string
                example: "You are not logged in!"

paths:
  /jobs:
    get:
      security:
        - bearerAuth: []
      summary: "Get all jobs"
      description: "Retrieves a list of jobs with optional filtering, sorting, and pagination."
      parameters:
        - in: query
          name: sort
          schema:
            type: string
          description: "Sort order for the jobs"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: "Page number for pagination"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: "Number of jobs per page"
      responses:
        "200":
          description: "A list of jobs"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  results:
                    type: integer
                    example: 2
                  data:
                    type: object
                    properties:
                      jobs:
                        type: array
                        items:
                          $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    post:
      security:
        - bearerAuth: []
      summary: "Create a new job"
      description: "Creates a new job with the provided details."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Job"
      responses:
        "201":
          description: "Job created successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      product:
                        $ref: "#/components/schemas/Job"
        "400":
          description: "Invalid input"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  message:
                    type: string
                    example: "no job input"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: "ID of the job"
        schema:
          type: string

    get:
      security:
        - bearerAuth: []
      summary: "Get a job by ID"
      description: "Retrieves details of a single job by its ID."
      responses:
        "200":
          description: "Job details"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      job:
                        $ref: "#/components/schemas/Job"
        "404":
          description: "Job not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  message:
                    type: string
                    example: "no job found with this id"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    patch:
      security:
        - bearerAuth: []
      summary: "Update a job by ID"
      description: "Updates one or more fields of a job by its ID."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Job"
      responses:
        "200":
          description: "Job updated"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  job:
                    $ref: "#/components/schemas/Job"
        "404":
          description: "Job not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  message:
                    type: string
                    example: "no product found with this id"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    delete:
      security:
        - bearerAuth: []
      summary: "Delete a job by ID"
      description: "Deletes a job by its ID."
      responses:
        "200":
          description: "Job deleted successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
        "404":
          description: "Job not found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  message:
                    type: string
                    example: "no job found with this id"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
